- name: demo on task level varabless
  hosts: local
  connection: local
  vars:
    property: "10acers"
  tasks:
  - name: print the vars
    debu:
    msg: "hi, I got {{ property }} from my father"

  - name: print the vars again 
  vars:
    property: "10acers" 
  debu:
    msg: "hi, I got {{ property }} from my father"

